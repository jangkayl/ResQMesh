name: Lean QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, unit tests, lint, and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK, run unit tests, and run Android Lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain --no-daemon

      - name: Check canonical documentation
        shell: pwsh
        run: ./scripts/check_docs.ps1

      - name: Check pull-request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check working tree diff
        if: github.event_name != 'pull_request'
        run: git diff --check
